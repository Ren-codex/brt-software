<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Dark Glass Mockup</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(160deg, #0d3b2e 0%, #1a5c48 50%, #0f4a38 100%);
  position: relative;
  overflow: hidden;
}

/* Decorative circles */
.deco {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.04);
  pointer-events: none;
}
.deco-1 { width: 300px; height: 300px; top: -90px; left: -90px; }
.deco-2 { width: 220px; height: 220px; bottom: -70px; right: -70px; }
.deco-3 { width: 150px; height: 150px; top: 48%; left: 80%; }

/* Glass card */
.card {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  padding: 40px 38px 36px;
  width: 100%;
  max-width: 440px;
  margin: 20px;
}

/* Branding */
.brand {
  text-align: center;
  margin-bottom: 30px;
}
.logo-wrap {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  overflow: hidden;
}
.logo-wrap img {
  width: 56px; height: 56px; object-fit: contain;
  filter: brightness(0) invert(1);
}
.logo-placeholder {
  font-size: 2rem; color: #a8d5c5;
}
.brand-name {
  font-size: 1.1rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}
.brand-tag {
  font-size: 0.76rem;
  color: rgba(255,255,255,0.45);
}

/* Alerts */
.alert {
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.8rem;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.alert-error {
  background: rgba(239,68,68,0.15);
  border: 1px solid rgba(239,68,68,0.3);
  color: #fca5a5;
}
.alert-success {
  background: rgba(61,191,152,0.15);
  border: 1px solid rgba(61,191,152,0.3);
  color: #6ee7c7;
}

/* Field label */
.field-label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  color: rgba(255,255,255,0.65);
  margin-bottom: 7px;
}

/* Input */
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
  margin-bottom: 18px;
}
.input-icon {
  position: absolute;
  left: 14px;
  color: rgba(255,255,255,0.35);
  font-size: 1rem;
  pointer-events: none;
}
.input {
  width: 100%;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 12px;
  padding: 13px 44px 13px 42px;
  font-size: 0.9rem;
  color: #fff;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input::placeholder { color: rgba(255,255,255,0.28); }
.input:focus {
  border-color: rgba(61,191,152,0.6);
  box-shadow: 0 0 0 3px rgba(61,191,152,0.14);
}
.input-eye {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.35);
  cursor: pointer;
  font-size: 1rem;
  padding: 4px;
  line-height: 1;
}
.input-eye:hover { color: rgba(255,255,255,0.7); }

/* Error text */
.field-error {
  font-size: 0.76rem;
  color: #f87171;
  margin-top: -12px;
  margin-bottom: 14px;
  padding-left: 4px;
}

/* Remember me */
.remember-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
}
.remember-check {
  width: 16px; height: 16px;
  accent-color: #3dbf98;
  cursor: pointer;
}
.remember-label {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
}

/* Sign in button */
.signin-btn {
  display: block;
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #3dbf98 0%, #2a9478 100%);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 22px rgba(0,0,0,0.28);
  transition: transform 0.15s, box-shadow 0.15s;
}
.signin-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 26px rgba(0,0,0,0.35);
}

/* Error state demo on second input */
.input-wrap.demo-error .input {
  border-color: rgba(239,68,68,0.6);
}
</style>
</head>
<body>

<div class="deco deco-1"></div>
<div class="deco deco-2"></div>
<div class="deco deco-3"></div>

<div class="card">

  <!-- Branding -->
  <div class="brand">
    <div class="logo-wrap">
      <i class="ri-building-2-line logo-placeholder"></i>
    </div>
    <div class="brand-name">BRT Accounting Software</div>
    <div class="brand-tag">Business Information Management System</div>
  </div>

  <!-- Error alert (shown on bad credentials) -->
  <div class="alert alert-error">
    <i class="ri-error-warning-line"></i>
    Incorrect email or password.
  </div>

  <!-- Username / Email -->
  <label class="field-label">Username or Email</label>
  <div class="input-wrap">
    <i class="ri-user-line input-icon"></i>
    <input class="input" type="text" placeholder="Enter username or email address">
  </div>

  <!-- Password -->
  <label class="field-label">Password</label>
  <div class="input-wrap demo-error">
    <i class="ri-lock-line input-icon"></i>
    <input class="input" type="password" placeholder="Enter password" value="wrongpass">
    <button class="input-eye"><i class="ri-eye-line"></i></button>
  </div>
  <div class="field-error">The provided credentials are incorrect.</div>

  <!-- Remember me -->
  <div class="remember-row">
    <input type="checkbox" class="remember-check" id="rem">
    <label class="remember-label" for="rem">Remember me</label>
  </div>

  <!-- Submit -->
  <button class="signin-btn">Sign In</button>

</div>

</body>
</html>
