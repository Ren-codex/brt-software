<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lock Screen — Mockup</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
    position: relative;
    overflow: hidden;
  }

  /* Floating grains — same as login */
  .floating-grain {
    position: absolute;
    background: rgba(46, 139, 87, 0.1);
    border-radius: 50%;
    animation: float 15s infinite linear;
    pointer-events: none;
  }
  .floating-grain:nth-child(1) { width:80px;  height:80px;  top:10%; left:5%;  animation-duration:20s; animation-delay:0s; }
  .floating-grain:nth-child(2) { width:60px;  height:60px;  top:70%; left:10%; animation-duration:18s; animation-delay:2s; }
  .floating-grain:nth-child(3) { width:100px; height:100px; top:40%; left:80%; animation-duration:22s; animation-delay:4s; }
  .floating-grain:nth-child(4) { width:50px;  height:50px;  top:20%; left:70%; animation-duration:16s; animation-delay:1s; }
  .floating-grain:nth-child(5) { width:70px;  height:70px;  top:60%; left:85%; animation-duration:19s; animation-delay:3s; }

  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg);   opacity: 0.7; }
    50%  { transform: translateY(-20px) rotate(180deg); opacity: 0.9; }
    100% { transform: translateY(0) rotate(360deg); opacity: 0.7; }
  }

  /* Card */
  .lock-card {
    position: relative;
    z-index: 2;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    overflow: hidden;
    width: 100%;
    max-width: 440px;
    margin: 20px;
  }

  /* Green top stripe */
  .card-stripe {
    height: 6px;
    background: linear-gradient(90deg, #2e8b57 0%, #1f6b41 100%);
  }

  .card-body { padding: 36px 32px 32px; }

  /* Avatar section */
  .avatar-section {
    text-align: center;
    margin-bottom: 28px;
  }

  .avatar-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(145deg, #2d947c 0%, #1d6454 100%);
    color: #fff;
    font-size: 2rem;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(46,139,87,0.3);
    margin-bottom: 12px;
  }

  .user-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 4px;
  }

  .lock-title {
    font-size: 0.82rem;
    color: #7f8c8d;
  }

  /* Form */
  .form-label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 7px;
  }

  .input-group {
    display: flex;
    border: 1px solid #e9ecef;
    border-radius: 10px;
    overflow: hidden;
    transition: all 0.3s;
    margin-bottom: 6px;
  }

  .input-group:focus-within {
    border-color: #2e8b57;
    box-shadow: 0 0 0 3px rgba(46,139,87,0.15);
  }

  .input-prefix {
    display: flex; align-items: center; padding: 0 14px;
    background: #f8f9fa; color: #7f8c8d; font-size: 1rem;
    border-right: 1px solid #e9ecef;
  }

  .input-field {
    flex: 1; border: none; outline: none;
    padding: 13px 14px; font-size: 0.92rem; color: #2c3e50;
    background: #fff;
  }

  .input-field::placeholder { color: #b0bec5; }

  .toggle-btn {
    background: none; border: none; color: #7f8c8d;
    padding: 0 14px; cursor: pointer; font-size: 1rem;
  }
  .toggle-btn:hover { color: #2e8b57; }

  .mb-form { margin-bottom: 20px; }

  /* Unlock button */
  .unlock-btn {
    display: block; width: 100%;
    background: linear-gradient(135deg, #2e8b57 0%, #1f6b41 100%);
    color: #fff; border: none; border-radius: 10px;
    padding: 13px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(46,139,87,0.3);
    transition: all 0.3s;
    margin-bottom: 24px;
  }

  .unlock-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(46,139,87,0.4);
  }

  .signin-link {
    text-align: center;
    font-size: 0.84rem;
    color: #7f8c8d;
  }

  .signin-link a {
    color: #2e8b57;
    font-weight: 600;
    text-decoration: none;
  }

  .signin-link a:hover { color: #1f6b41; }
</style>
</head>
<body>

<!-- Background grains -->
<div class="floating-grain"></div>
<div class="floating-grain"></div>
<div class="floating-grain"></div>
<div class="floating-grain"></div>
<div class="floating-grain"></div>

<div class="lock-card">
  <div class="card-stripe"></div>
  <div class="card-body">

    <!-- Avatar -->
    <div class="avatar-section">
      <div class="avatar-wrap">S</div>
      <div class="user-name">superadmin01</div>
      <div class="lock-title">Confirm your password to continue</div>
    </div>

    <!-- Form -->
    <div class="mb-form">
      <label class="form-label">Password</label>
      <div class="input-group">
        <span class="input-prefix"><i class="ri-lock-password-line"></i></span>
        <input class="input-field" type="password" placeholder="Enter your password">
        <button class="toggle-btn" type="button"><i class="ri-eye-line"></i></button>
      </div>
    </div>

    <button class="unlock-btn">Unlock</button>

    <div class="signin-link">Not you? return <a href="#">Signin</a></div>

  </div>
</div>

</body>
</html>
